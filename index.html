<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOXSTORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #059669 0%, #10b981 100%);
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* THANH THÔNG BÁO LED - SỬA LỖI CHỮ LOẠN */
        .top-bar {
            width: 92%;
            max-width: 450px;
            margin: 1rem auto 0;
            background: rgba(6, 78, 59, 0.85);
            border: 2px solid #34d399;
            border-radius: 14px;
            padding: 0.6rem 0;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(52,211,153,0.25), inset 0 0 10px rgba(0,0,0,0.2);
        }
        .text-track {
            display: flex;
            width: max-content;
            animation: scrollSmooth 7s linear infinite;
        }
        .text-content {
            flex-shrink: 0;
            padding: 0 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6ee7b7;
            text-shadow: 0 0 6px #10b981;
            white-space: nowrap;
        }
        @keyframes scrollSmooth {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Biểu tượng & Tiêu đề */
        .header-section {
            text-align: center;
            margin-top: 2.5rem;
            color: white;
        }
        .cart-logo { font-size: 3.5rem; margin-bottom: 1rem; }
        h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: 0.5px; }
        .desc {
            font-size: 1.25rem;
            opacity: 0.95;
            margin-top: 0.8rem;
            line-height: 1.6;
        }
        .divider-line {
            width: 85%;
            height: 6px;
            background: linear-gradient(90deg, #34d399, #22d3ee, #34d399);
            border-radius: 999px;
            margin: 2rem auto;
        }

        /* FORM ĐĂNG NHẬP */
        .form-card {
            width: 90%;
            max-width: 420px;
            margin: 0 auto;
            background: linear-gradient(180deg, #2563eb 0%, #3b82f6 100%);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            color: white;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }
        .form-title {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
        }
        .field { margin-bottom: 1.5rem; }
        .field label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            opacity: 0.92;
        }
        .field input {
            width: 100%;
            padding: 1rem 1.3rem;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            background: white;
            color: #1f2937;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .field input:focus { box-shadow: 0 0 0 4px rgba(16,185,129,0.35); }
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .form-footer label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .form-footer input[type="checkbox"] { width: auto; }
        .form-footer a { color: #a7f3d0; text-decoration: none; }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 16px;
            background: #10b981;
            color: white;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #059669; transform: translateY(-2px); }
    </style>
</head>
<body>
    <!-- THANH NỘI DUNG ĐÚNG, KHÔNG BỊ MÊNH HOẶC TRÙNG -->
    <div class="top-bar">
        <div class="text-track">
            <div class="text-content">
                ⬅️ Tài • NHÀ PHÁT TRIỂN: Huỳnh Phát Tài • ĐỒNG SÁNG LẬP: Không ai • BLOXSTORE TEAM 🚀
            </div>
            <div class="text-content">
                ⬅️ Tài • NHÀ PHÁT TRIỂN: Huỳnh Phát Tài • ĐỒNG SÁNG LẬP: Không ai • BLOXSTORE TEAM 🚀
            </div>
        </div>
    </div>

    <div class="header-section">
        <div class="cart-logo"><i class="fa-solid fa-cart-shopping"></i></div>
        <h1>BLOXSTORE</h1>
        <p class="desc">
            Dịch vụ tin cậy • Nền tảng an toàn<br>
            • Hiện đại • Nền tảng Python
        </p>
    </div>

    <div class="divider-line"></div>

    <div class="form-card">
        <h2 class="form-title"><span>➔</span> Đăng Nhập</h2>

        <div class="field">
            <label>Tên tài khoản / Email</label>
            <input type="text" placeholder="Nhập thông tin...">
        </div>

        <div class="field">
            <label>Mật khẩu</label>
            <input type="password" placeholder="••••••••••">
        </div>

        <div class="form-footer">
            <label><input type="checkbox"> Ghi nhớ đăng nhập</label>
            <a href="#">Quên mật khẩu?</a>
        </div>

        <button class="btn-submit"><i class="fa-solid fa-lock"></i> Tiếp tục</button>
    </div>
</body>
</html>
